<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Card</title>
<style>
html,body{margin:0}body{background:var(--surface);color:var(--content);font-family:var(--font-sans);font-size:15px;line-height:24px;padding:20px 24px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.stack{display:flex;flex-direction:column;gap:12px}
.eb{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--content-muted)}
.small{font-size:13px;line-height:20px;color:var(--content-muted)}.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);font-weight:300;letter-spacing:-.015em}.disp em{font-style:italic;color:var(--secondary)}
:focus-visible{outline:2px solid var(--secondary-border);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:2px;font-size:10.5px;line-height:1;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:var(--surface-sunken);color:var(--content-muted)}
.pill svg{width:12px;height:12px}.ok{background:var(--status-success-bg);color:var(--status-success)}.warn{background:var(--status-warning-bg);color:var(--status-warning)}.crit{background:var(--status-danger-bg);color:var(--status-danger)}.info{background:var(--status-info-bg);color:var(--status-info)}.dark{background:var(--content);color:var(--content-inverse)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-content);border-radius:0;font:500 11px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background .15s ease-out,color .15s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}.btn.sm{height:36px;padding:0 14px}
.btn.accent{background:var(--secondary);border-color:var(--secondary)}
.btn.outline{background:transparent;color:var(--content)}.btn.outline:hover{background:var(--content);color:var(--content-inverse)}
.btn.bronze{background:transparent;color:var(--secondary);border-color:var(--secondary-border)}.btn.bronze:hover{background:var(--secondary);border-color:var(--secondary);color:var(--content-inverse)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--content);padding:0 4px;height:auto;letter-spacing:.12em}.btn.ghost:hover{text-decoration:underline}
.btn.danger{background:transparent;color:var(--status-danger);border-color:var(--status-danger)}.btn.danger:hover{background:var(--status-danger);color:var(--content-inverse)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface-raised);border:1px solid var(--surface-border);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}@media(max-width:600px){.grid{grid-template-columns:1fr}}.card h3{font-size:16px;line-height:24px;font-weight:600;margin:0}.meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--content-muted)}.meta span{display:inline-flex;gap:6px;align-items:center}.click{cursor:pointer;transition:border-color .15s ease-out}.click:hover{border-color:var(--secondary-border)}.prep{background:var(--surface-sunken);padding:14px 16px;font-size:14px;line-height:22px}
</style></head>
<body>
<div class="grid">
<div class="card"><div class="eb">Next appointment</div><h3>Follow-up consultation</h3><div class="meta"><span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Wed 18 Nov 2026, 10:30</span><span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>Harley Street</span></div><p class="small" style="margin:0">With Dr Gina Schoeman · 30 minutes</p><div class="row" style="margin-top:auto"><button class="btn outline sm">View details</button></div></div>
<div class="card click"><div class="eb">Order LO-2026-014 · Ordered 21 Oct 2026</div><div class="row" style="justify-content:space-between;align-items:flex-start"><h3 class="disp" style="font-size:24px;line-height:28px;margin:0;font-weight:300">Female Hormone &amp; Metabolic Panel</h3><span class="pill warn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Awaiting payment</span></div><div class="prep"><b>Before your test.</b> Fast for 10 hours. Morning sample before 10:00.</div><div class="row" style="margin-top:auto"><button class="btn sm">Pay now — £295.00</button></div></div></div>
</body>
</html>
