<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>SidebarNav</title>
<style>
html,body{margin:0}body{background:var(--surface);color:var(--content);font-family:var(--font-sans);font-size:15px;line-height:24px;padding:20px 24px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.stack{display:flex;flex-direction:column;gap:12px}
.eb{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--content-muted)}
.small{font-size:13px;line-height:20px;color:var(--content-muted)}.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);font-weight:300;letter-spacing:-.015em}.disp em{font-style:italic;color:var(--secondary)}
:focus-visible{outline:2px solid var(--secondary-border);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:2px;font-size:10.5px;line-height:1;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:var(--surface-sunken);color:var(--content-muted)}
.pill svg{width:12px;height:12px}.ok{background:var(--status-success-bg);color:var(--status-success)}.warn{background:var(--status-warning-bg);color:var(--status-warning)}.crit{background:var(--status-danger-bg);color:var(--status-danger)}.info{background:var(--status-info-bg);color:var(--status-info)}.dark{background:var(--content);color:var(--content-inverse)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-content);border-radius:0;font:500 11px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background .15s ease-out,color .15s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}.btn.sm{height:36px;padding:0 14px}
.btn.accent{background:var(--secondary);border-color:var(--secondary)}
.btn.outline{background:transparent;color:var(--content)}.btn.outline:hover{background:var(--content);color:var(--content-inverse)}
.btn.bronze{background:transparent;color:var(--secondary);border-color:var(--secondary-border)}.btn.bronze:hover{background:var(--secondary);border-color:var(--secondary);color:var(--content-inverse)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--content);padding:0 4px;height:auto;letter-spacing:.12em}.btn.ghost:hover{text-decoration:underline}
.btn.danger{background:transparent;color:var(--status-danger);border-color:var(--status-danger)}.btn.danger:hover{background:var(--status-danger);color:var(--content-inverse)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface-raised);border:1px solid var(--surface-border);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{padding:0}.side{width:264px;border-right:1px solid var(--surface-border);padding:24px 16px;display:flex;flex-direction:column;min-height:420px}.wm{padding:0 12px 20px}.the{font-size:10px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--content-muted)}.name{font:300 26px/1.05 var(--font-display);margin-top:4px}nav{display:flex;flex-direction:column;gap:2px}nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;text-decoration:none;font-size:14px;color:var(--content-muted);border-left:2px solid transparent}nav a:hover{color:var(--content);background:var(--surface-sunken)}nav a[aria-current]{color:var(--content);background:var(--surface-selected);border-left-color:var(--secondary-border)}.foot{margin-top:auto;border-top:1px solid var(--surface-border);padding:16px 12px 0;display:flex;align-items:center;gap:12px;color:var(--content-muted)}.foot b{font-size:13px;color:var(--content);font-weight:600}.av{width:36px;height:36px;border-radius:50%;background:var(--surface-selected);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--secondary)}
</style></head>
<body>
<aside class="side"><div class="wm"><div class="the">The</div><div class="name">Schoeman Clinic</div><div class="eb" style="margin-top:10px">Patient portal</div></div><nav><a href="#" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Home</span></a><a href="#" aria-current=page><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.6 18.8A1.5 1.5 0 0 0 5.9 21h12.2a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/></svg><span>Lab orders</span></a><a href="#" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>My results</span></a><a href="#" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="8" rx="4"/><path d="M12 8v8"/></svg><span>Prescriptions</span></a><a href="#" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Appointments</span></a><a href="#" ><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Ask the clinic</span></a></nav><div class="foot"><div class="av">EH</div><div style="flex:1"><b>Eleanor Hart</b><div class="small">Patient</div></div><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg></div></aside>
</body>
</html>
