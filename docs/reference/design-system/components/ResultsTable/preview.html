<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>ResultsTable</title>
<style>
html,body{margin:0}body{background:var(--surface);color:var(--content);font-family:var(--font-sans);font-size:15px;line-height:24px;padding:20px 24px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.stack{display:flex;flex-direction:column;gap:12px}
.eb{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--content-muted)}
.small{font-size:13px;line-height:20px;color:var(--content-muted)}.num{font-variant-numeric:tabular-nums}
.disp{font-family:var(--font-display);font-weight:300;letter-spacing:-.015em}.disp em{font-style:italic;color:var(--secondary)}
:focus-visible{outline:2px solid var(--secondary-border);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:2px;font-size:10.5px;line-height:1;font-weight:500;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:var(--surface-sunken);color:var(--content-muted)}
.pill svg{width:12px;height:12px}.ok{background:var(--status-success-bg);color:var(--status-success)}.warn{background:var(--status-warning-bg);color:var(--status-warning)}.crit{background:var(--status-danger-bg);color:var(--status-danger)}.info{background:var(--status-info-bg);color:var(--status-info)}.dark{background:var(--content);color:var(--content-inverse)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-content);border-radius:0;font:500 11px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;white-space:nowrap;transition:background .15s ease-out,color .15s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}.btn.sm{height:36px;padding:0 14px}
.btn.accent{background:var(--secondary);border-color:var(--secondary)}
.btn.outline{background:transparent;color:var(--content)}.btn.outline:hover{background:var(--content);color:var(--content-inverse)}
.btn.bronze{background:transparent;color:var(--secondary);border-color:var(--secondary-border)}.btn.bronze:hover{background:var(--secondary);border-color:var(--secondary);color:var(--content-inverse)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--content);padding:0 4px;height:auto;letter-spacing:.12em}.btn.ghost:hover{text-decoration:underline}
.btn.danger{background:transparent;color:var(--status-danger);border-color:var(--status-danger)}.btn.danger:hover{background:var(--status-danger);color:var(--content-inverse)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--surface-raised);border:1px solid var(--surface-border);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}th{font-size:11px;line-height:16px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--content-muted);text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--surface-border);white-space:nowrap}td{padding:14px 12px;border-bottom:1px solid var(--surface-border);vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover td{background:var(--surface-sunken)}td b{font-weight:500}.r{text-align:right}.val{font-weight:500;font-variant-numeric:tabular-nums}.sub{display:block;font-size:12px;color:var(--content-muted)}
</style></head>
<body>
<div class="wrap"><table><thead><tr><th>Marker</th><th class="r">Latest</th><th>Unit</th><th>Range</th><th>Status</th><th>Trend</th><th>Date</th></tr></thead><tbody><tr><td><b>HbA1c</b><span class="sub">Metabolic</span></td><td class="r"><span class="val" style="color:var(--status-danger)">43</span></td><td class="small">mmol/mol</td><td class="small num">20–41</td><td><span class="pill crit"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/></svg>OUT OF RANGE</span></td><td><svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true"><path d="M2.0 3.0 L48.0 17.7 L94.0 25.0" fill="none" stroke="var(--secondary)" stroke-width="1.5"/><circle cx="94.0" cy="25.0" r="3" fill="var(--status-danger)"/></svg></td><td class="small">14 Oct 2026</td></tr><tr><td><b>Vitamin D</b><span class="sub">Vitamins</span></td><td class="r"><span class="val" style="color:var(--status-warning)">71</span></td><td class="small">nmol/L</td><td class="small num">75–200</td><td><span class="pill warn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>BORDERLINE</span></td><td><svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true"><path d="M2.0 25.0 L48.0 13.0 L94.0 3.0" fill="none" stroke="var(--secondary)" stroke-width="1.5"/><circle cx="94.0" cy="3.0" r="3" fill="var(--status-warning)"/></svg></td><td class="small">14 Oct 2026</td></tr><tr><td><b>Ferritin</b><span class="sub">Vitamins</span></td><td class="r"><span class="val" style="">42</span></td><td class="small">µg/L</td><td class="small num">30–200</td><td><span class="pill ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>IN RANGE</span></td><td><svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true"><path d="M2.0 25.0 L48.0 16.4 L94.0 3.0" fill="none" stroke="var(--secondary)" stroke-width="1.5"/><circle cx="94.0" cy="3.0" r="3" fill="var(--secondary)"/></svg></td><td class="small">14 Oct 2026</td></tr><tr><td><b>TSH</b><span class="sub">Thyroid</span></td><td class="r"><span class="val" style="">2.2</span></td><td class="small">mIU/L</td><td class="small num">0.4–4.0</td><td><span class="pill ok"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>IN RANGE</span></td><td><svg width="96" height="28" viewBox="0 0 96 28" aria-hidden="true"><path d="M2.0 3.0 L48.0 25.0 L94.0 14.0" fill="none" stroke="var(--secondary)" stroke-width="1.5"/><circle cx="94.0" cy="14.0" r="3" fill="var(--secondary)"/></svg></td><td class="small">14 Oct 2026</td></tr></tbody></table></div>
</body>
</html>
