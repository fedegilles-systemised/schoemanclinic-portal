<title>Schoeman Clinic Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: fixed left sidebar + scrolling content column; demo banner on top switches Patient / Clinic views. Single light theme, matching theschoemanclinic.com. */
:root{
  color-scheme: light;
  /* Primary */
  --primary: oklch(19% .008 60);
  --primary-hover: oklch(14% .006 60);
  --primary-content: oklch(97.7% .006 80);
  /* Secondary */
  --secondary: oklch(47% .06 60);
  --secondary-border: oklch(55% .06 60);
  --secondary-content: oklch(97.7% .006 80);
  /* Accent */
  --accent: oklch(78% .055 78);
  --accent-subtle: oklch(78% .055 78 / .22);
  --accent-content: oklch(19% .008 60);
  /* Status */
  --status-success: oklch(50% .07 150); --status-success-bg: oklch(94% .025 150);
  --status-warning: oklch(52% .09 70); --status-warning-bg: oklch(94% .035 80);
  --status-danger: oklch(50% .15 27); --status-danger-bg: oklch(95% .025 27);
  --status-info: oklch(48% .03 240); --status-info-bg: oklch(94% .01 240);
  /* Content */
  --content: oklch(19% .008 60);
  --content-muted: oklch(45% .012 60);
  --content-inverse: oklch(97.7% .006 80);
  /* Surface */
  --surface: oklch(97.7% .006 80);
  --surface-raised: oklch(98.5% .005 80);
  --surface-sunken: oklch(94% .006 75);
  --surface-selected: oklch(93% .008 75);
  --surface-inverse: oklch(14% .006 60);
  --surface-border: oklch(88% .008 75);
  --surface-overlay: oklch(14% .006 60 / .38);
  /* Type */
  --display: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
  --sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--surface);color:var(--content);font:400 15px/24px var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--secondary-border);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* Demo banner */
.banner{position:sticky;top:0;z-index:40;background:var(--surface-inverse);color:var(--content-inverse);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.banner .switch{display:flex;align-items:center;gap:8px}
.banner .switch button{background:transparent;border:1px solid oklch(97.7% .006 80 / .35);color:var(--content-inverse);padding:3px 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.banner .switch button[aria-pressed="true"]{background:var(--content-inverse);color:var(--surface-inverse);border-color:var(--content-inverse)}

/* Shell */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:calc(100% - 34px)}
.sidebar{border-right:1px solid var(--surface-border);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:34px;height:calc(100vh - 34px);overflow-y:auto;padding:28px 16px 20px max(16px,env(safe-area-inset-left,0px))}
.wordmark{padding:0 12px 24px}
.wordmark .the{font:500 10px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--content-muted)}
.wordmark .name{font:300 26px/1.05 var(--display);letter-spacing:-.01em;margin-top:4px}
.wordmark .portal{margin-top:10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .group{font:500 10.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--content-muted);padding:18px 12px 8px}
.nav a{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;text-decoration:none;font-size:14px;color:var(--content-muted);border-left:2px solid transparent;transition:background .15s ease-out,color .15s ease-out}
.nav a:hover{color:var(--content);background:var(--surface-sunken)}
.nav a[aria-current="page"]{color:var(--content);background:var(--surface-selected);border-left-color:var(--secondary-border)}
.nav a .count{margin-left:auto;font-size:11px;min-width:20px;height:20px;display:grid;place-items:center;background:var(--content);color:var(--content-inverse);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;border-top:1px solid var(--surface-border);padding:16px 12px 0;display:flex;align-items:center;gap:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--surface-selected);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--secondary);flex:none}
.side-foot .who{min-width:0;flex:1}
.side-foot .who b{display:block;font-size:13px;font-weight:600;line-height:18px}
.side-foot .who span{font-size:12px;color:var(--content-muted)}
.iconbtn{background:transparent;border:0;padding:6px;cursor:pointer;color:var(--content-muted);display:grid;place-items:center}
.iconbtn:hover{color:var(--content)}

.main{min-width:0;padding-block:0 64px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:max(40px,env(safe-area-inset-right,0px))}
.topbar{height:64px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--surface-border);margin-bottom:36px}
.topbar .crumb{flex:1;min-width:0}
.topbar .search{display:flex;align-items:center;gap:8px;border:1px solid var(--surface-border);background:var(--surface-raised);height:36px;padding:0 12px;width:260px;color:var(--content-muted)}
.topbar .search input{border:0;background:transparent;outline:0;width:100%;font-size:13px;color:var(--content)}
.menu-btn{display:none}
.content{max-width:1200px}

/* Type */
.eyebrow{font:500 11px/16px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--content-muted)}
h1.title{font:300 40px/44px var(--display);letter-spacing:-.02em;margin:6px 0 0;text-wrap:balance}
h1.title em,h2.sec em{font-style:italic;color:var(--secondary)}
h2.sec{font:300 28px/34px var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}
.lede{color:var(--content-muted);max-width:62ch;margin:10px 0 0}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:32px}
.small{font-size:13px;line-height:20px;color:var(--content-muted)}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:24px}
.section{margin-top:48px;display:flex;flex-direction:column;gap:16px}
.section-head{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}

/* Cards */
.grid{display:grid;gap:24px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--surface-raised);border:1px solid var(--surface-border);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.click{cursor:pointer;transition:border-color .15s ease-out}
.card.click:hover{border-color:var(--secondary-border)}
.card h3{font:600 16px/24px var(--sans);margin:0}
.card .actions{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.stat .big{font:500 32px/36px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px}
.kv dt{color:var(--content-muted)}
.kv dd{margin:0}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--content-muted)}
.meta-row span{display:inline-flex;align-items:center;gap:6px}
hr.rule{border:0;border-top:1px solid var(--surface-border);margin:4px 0;width:100%}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border:2px solid var(--primary);background:var(--primary);color:var(--primary-content);border-radius:0;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s ease-out,color .15s ease-out,border-color .15s ease-out}
.btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
.btn.sm{height:36px;padding:0 14px}
.btn.accent{background:var(--secondary);border-color:var(--secondary);color:var(--secondary-content)}
.btn.accent:hover{background:oklch(41% .06 60);border-color:oklch(41% .06 60)}
.btn.outline{background:transparent;color:var(--content)}
.btn.outline:hover{background:var(--content);color:var(--content-inverse)}
.btn.bronze{background:transparent;color:var(--secondary);border-color:var(--secondary-border)}
.btn.bronze:hover{background:var(--secondary);border-color:var(--secondary);color:var(--content-inverse)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--content);padding:0 4px;height:auto;letter-spacing:.12em}
.btn.ghost:hover{text-decoration:underline}
.btn.danger{background:transparent;color:var(--status-danger);border-color:var(--status-danger)}
.btn.danger:hover{background:var(--status-danger);color:var(--content-inverse)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:2px;font:500 10.5px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;background:var(--surface-sunken);color:var(--content-muted)}
.pill svg{width:12px;height:12px}
.pill.ok{background:var(--status-success-bg);color:var(--status-success)}
.pill.warn{background:var(--status-warning-bg);color:var(--status-warning)}
.pill.crit{background:var(--status-danger-bg);color:var(--status-danger)}
.pill.info{background:var(--status-info-bg);color:var(--status-info)}
.pill.dark{background:var(--content);color:var(--content-inverse)}
.v-ok{color:var(--status-success)} .v-warn{color:var(--status-warning)} .v-crit{color:var(--status-danger)}

/* Alert bar */
.alert{display:flex;align-items:center;gap:14px;border:1px solid var(--surface-border);border-left-width:3px;padding:14px 18px;background:var(--surface-raised);flex-wrap:wrap}
.alert .t{flex:1;min-width:200px}
.alert b{font-weight:600}
.alert.warn{border-color:var(--status-warning);background:var(--status-warning-bg)}
.alert.crit{border-color:var(--status-danger);background:var(--status-danger-bg)}
.alert.info{border-color:var(--status-info);background:var(--status-info-bg)}
.alert svg{flex:none}

/* Tables */
.tablewrap{overflow-x:auto;min-width:0}
table{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
th{font:500 11px/16px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--content-muted);text-align:left;padding:0 12px 10px;border-bottom:1px solid var(--surface-border);white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--surface-border);vertical-align:middle}
tr.row{cursor:pointer;transition:background .15s ease-out}
tr.row:hover td{background:var(--surface-sunken)}
td.r,th.r{text-align:right}
td .val{font-weight:500;font-variant-numeric:tabular-nums}
td .sub{display:block;font-size:12px;color:var(--content-muted)}

/* Chips & tabs */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:32px;padding:0 14px;border:1px solid var(--surface-border);background:var(--surface-raised);font-size:13px;cursor:pointer;color:var(--content-muted)}
.chip:hover{border-color:var(--secondary-border);color:var(--content)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--content-inverse)}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--surface-border);overflow-x:auto}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:0 0 12px;font:500 11px/16px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--content-muted);cursor:pointer;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--content);border-bottom-color:var(--secondary-border)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:500 11px/16px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--content-muted)}
.input,select.input,textarea.input{height:44px;border:1px solid var(--surface-border);background:var(--surface-raised);border-radius:0;padding:0 14px;width:100%;transition:border-color .15s ease-out}
textarea.input{height:auto;min-height:120px;padding:12px 14px;resize:vertical;line-height:22px}
.input:focus{outline:0;border-color:var(--secondary-border)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer}
.toggle input{appearance:none;width:40px;height:22px;border-radius:9999px;border:0;background:var(--surface-border);position:relative;cursor:pointer;margin:0;flex:none;transition:background .15s ease-out}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:9999px;background:var(--surface-raised);border:1px solid var(--surface-border);box-sizing:border-box;transition:left .15s ease-out}
.toggle input:checked{background:var(--secondary)}
.toggle input:checked::after{left:20px;border-color:var(--secondary)}
.toggle input:disabled{cursor:not-allowed;opacity:.6}

/* Steps */
.steps{display:flex;gap:0;list-style:none;padding:0;margin:4px 0}
.steps li{flex:1;display:flex;flex-direction:column;gap:8px;font-size:12px;color:var(--content-muted);position:relative}
.steps li::before{content:"";height:2px;background:var(--surface-border);display:block}
.steps li.done::before{background:var(--secondary)}
.steps li.done{color:var(--content)}
.steps li.now{color:var(--content);font-weight:500}
.steps li.now::before{background:linear-gradient(90deg,var(--secondary) 50%,var(--surface-border) 50%)}

/* Overlay: sheet and dialog */
.overlay{position:fixed;inset:0;background:var(--surface-overlay);z-index:60;display:flex;justify-content:flex-end}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.sheet{background:var(--surface);width:min(520px,100%);height:100%;overflow-y:auto;border-left:1px solid var(--surface-border);padding:28px max(28px,env(safe-area-inset-right,0px)) 40px 28px;display:flex;flex-direction:column;gap:20px}
.dialog{background:var(--surface);width:min(520px,100%);max-height:calc(100% - 32px);overflow-y:auto;border:1px solid var(--surface-border);padding:28px;display:flex;flex-direction:column;gap:18px}
.dialog.wide{width:min(640px,100%)}
.ov-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--surface-inverse);color:var(--content-inverse);padding:12px 18px;font-size:14px;z-index:80;max-width:calc(100% - 32px);display:flex;gap:10px;align-items:center}

/* Misc */
.dropzone{border:1px dashed var(--secondary-border);background:var(--surface-raised);padding:44px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer}
.dropzone.over{background:var(--surface-sunken)}
.prep{background:var(--surface-sunken);padding:14px 16px;font-size:14px;line-height:22px}
details summary{cursor:pointer;font-size:13px;color:var(--secondary);font-weight:500;list-style:none}
details summary::-webkit-details-marker{display:none}
details ul{columns:2;column-gap:24px;padding-left:18px;margin:10px 0 0;font-size:13px;line-height:22px}
.barcode{background:var(--surface-raised);border:1px solid var(--surface-border);padding:14px 18px;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.barcode svg{display:block;max-width:100%}
.letter{background:var(--surface-raised);border:1px solid var(--surface-border);padding:32px;font-size:14px;line-height:23px}
.letter .lh{font:300 22px/1 var(--display);margin-bottom:24px}
.comment{border:1px solid var(--surface-border);background:var(--surface-raised);padding:16px;display:flex;gap:12px}
.comment p{margin:4px 0 0}
.empty{border:1px dashed var(--surface-border);padding:32px;text-align:center;color:var(--content-muted)}
.pipeline{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--surface-border);padding-bottom:10px}
.mini{background:var(--surface-raised);border:1px solid var(--surface-border);padding:14px;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:19px}
.mini b{font-size:14px;font-weight:600}
.split{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;align-items:start}
.qitem{background:var(--surface-raised);border:1px solid var(--surface-border);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.qitem:hover{border-color:var(--secondary-border)}
.qitem[aria-current="true"]{border-color:var(--content);box-shadow:inset 3px 0 0 var(--secondary-border)}
.docprev{background:var(--surface-raised);border:1px solid var(--surface-border);padding:24px;font-size:12px;line-height:20px;color:var(--content-muted);min-height:360px}
.docprev .ln{height:8px;background:var(--surface-sunken);margin:8px 0}
.record-head{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.record-head .avatar{width:56px;height:56px;font-size:16px}
.quick{display:flex;flex-direction:column;gap:8px}
.quick .btn{justify-content:flex-start}
.auth{min-height:calc(100vh - 34px);display:grid;grid-template-columns:55% 45%}
.auth-visual{background:linear-gradient(oklch(14% .006 60 / .55),oklch(14% .006 60 / .72)),radial-gradient(120% 90% at 30% 20%,oklch(62% .03 70),oklch(30% .015 60));color:var(--content-inverse);padding:48px;display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
.auth-visual .eyebrow{color:oklch(90% .008 75 / .85)}
.auth-visual h2{font:300 52px/56px var(--display);letter-spacing:-.02em;margin:0;max-width:12ch}
.auth-visual h2 em{color:var(--accent)}
.auth-form{padding:48px max(48px,env(safe-area-inset-right,0px)) 48px 48px;display:flex;flex-direction:column;justify-content:center;gap:20px;max-width:480px}
.spark{display:block}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;height:100%;z-index:70;width:280px;transform:translateX(-100%);transition:transform .2s ease-out;padding-top:max(28px,env(safe-area-inset-top,0px))}
  .sidebar.open{transform:none;box-shadow:0 0 0 100vmax var(--surface-overlay)}
  .menu-btn{display:grid}
  .main{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .topbar .search{display:none}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-visual{min-height:280px;padding:28px}
  .auth-visual h2{font-size:38px;line-height:42px}
  .auth-form{padding:32px 20px}
}
@media (max-width:560px){
  .g4{grid-template-columns:minmax(0,1fr)}
  h1.title{font-size:32px;line-height:36px}
  details ul{columns:1}
  .letter{padding:20px}
}
</style>

<div class="banner" role="region" aria-label="Demo">
  <span>Demo environment · fictional data</span>
  <span class="switch"><span>View as</span><button type="button" id="view-patient" data-act="view" data-v="p">Patient</button><button type="button" id="view-clinic" data-act="view" data-v="c">Clinic</button></span>
</div>
<div id="root"></div>
<div id="ov" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(function(){
/* ---------- Icons ---------- */
const I={
home:'<path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/>',
flask:'<path d="M9 3h6M10 3v6L4.6 18.8A1.5 1.5 0 0 0 5.9 21h12.2a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/>',
activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
capsule:'<rect x="3" y="8" width="18" height="8" rx="4"/><path d="M12 8v8"/>',
calendar:'<rect x="3" y="5" width="18" height="16" rx="1"/><path d="M3 10h18M8 3v4M16 3v4"/>',
message:'<path d="M4 5h16v11H9l-5 4z"/>',
file:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',

<div class="split"><div class="stack" style="gap:10px">${list.map(x=>`<button class="qitem" data-act="impsel" data-id="${x.id}" aria-current="${x.id===S.impSel}"><span style="display:flex;justify-content:space-between;gap:8px;width:100%"><b style="font-weight:600;word-break:break-all">${esc(x.file)}</b></span><span style="display:flex;gap:6px;flex-wrap:wrap">${x.done?pill('ok','Done','check'):x.pid?pill('info','Matched','check'):pill('warn','Needs match','alert')}${pill('',x.source)}</span><span class="small">Received ${x.received}</span></button>`).join('')}</div>
<div class="grid g2" style="align-items:start"><div class="docprev" aria-label="Document preview"><div class="eyebrow">Preview</div><p style="margin:10px 0 4px;color:var(--content);font-weight:600;word-break:break-all">${esc(it.file)}</p>${Array.from({length:14},(_,i)=>`<div class="ln" style="width:${[92,70,84,60,88,76,50,90,66,80,58,86,72,40][i]}%"></div>`).join('')}</div>
<div class="card" style="gap:16px"><div class="field"><label for="imp-patient">Patient</label><select class="input" id="imp-patient" data-act="impmatch">${!it.pid?`<option value="">Choose a patient${it.guess?' · suggested: '+pById(it.guess).name:''}</option>`:''}${patients.map(x=>`<option value="${x.id}" ${x.id===it.pid?'selected':''}>${x.name} · ${x.dob}</option>`).join('')}</select></div>
${it.dup?`<div class="alert warn">${ic('alert')}<div class="t">These results look the same as a TDL panel already in the review queue.</div></div>`:''}
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="eyebrow">Extracted values</span><button class="btn bronze sm" data-act="confirmhigh" ${!it.pid||!pending?'disabled':''}>Confirm all high confidence</button></div>
${it.items.map((x,i)=>`<div style="border-top:1px solid var(--surface-border);padding-top:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><b style="font-weight:500">${x.k}</b> <span class="val num">${x.v}</span> <span class="small">${x.u} · range ${x.r}</span><div style="margin-top:4px">${pill(x.c==='HIGH'?'ok':x.c==='MEDIUM'?'warn':'crit',x.c+' confidence')}</div></div>${x.st?pill(x.st==='ok'?'dark':'',x.st==='ok'?'Confirmed':'Rejected'):`<span style="display:flex;gap:6px"><button class="btn accent sm" data-act="impitem" data-i="${i}" data-v="ok" ${!it.pid?'disabled':''}>Confirm</button><button class="btn danger sm" data-act="impitem" data-i="${i}" data-v="no">Reject</button></span>`}</div>`).join('')}
${!it.pid?`<p class="small" style="margin:0">Choose the patient before confirming values.</p>`:''}</div></div></div>`;}

function cOrders(){const os=S.orders.map(o=>o.id==='LO-2026-014'?{...o,stage:S.labPaid?1:0}:o);
 return `<div class="page-head"><div><div class="eyebrow">Patients</div><h1 class="title">Lab <em>orders</em></h1><p class="lede">Every order from request to review. Chasers for unpaid orders and missing samples run in GoHighLevel.</p></div><button class="btn" data-act="neworder">${ic('plus',15)}New order</button></div>
<div class="pipeline">${STAGES.map((s,i)=>{const col=os.filter(o=>o.stage===i);return `<div class="col"><div class="col-head"><span class="eyebrow">${s}</span><span class="small num">${col.length}</span></div>${col.map(o=>`<div class="mini" style="${o.risk?'border-left:3px solid var(--status-danger)':''}"><b>${pById(o.pid).name}</b><span>${o.panel}</span><span class="small num">${o.id} · £${o.price}.00</span><span class="small">Due by ${o.due} · appt ${o.appt}</span>${o.risk?`<span>${pill('crit','At risk','alert')}</span>`:''}</div>`).join('')||'<div class="small" style="padding:12px 0">Nothing here.</div>'}</div>`;}).join('')}</div>`;}

function newOrderDialog(pid){const today='2026-11-18';openOv(`<form class="dialog wide" id="order-form" role="dialog" aria-modal="true" aria-label="New lab order">${ovHead('New lab order','Order <em>bloods</em>')}
<div class="grid g2" style="gap:16px"><div class="field"><label for="no-patient">Patient</label><select class="input" id="no-patient">${patients.map(p=>`<option value="${p.id}" ${p.id===(pid||'eh')?'selected':''}>${p.name}</option>`).join('')}</select></div>
<div class="field"><label for="no-panel">Panel</label><select class="input" id="no-panel">${catalogue.map((c,i)=>`<option value="${i}">${c.n} · ${c.tests} tests</option>`).join('')}</select></div>
<div class="field"><label for="no-lab">Lab</label><select class="input" id="no-lab"><option>TDL Pathology</option><option>The Doctors Laboratory</option><option>Patient's own lab</option></select></div>
<div class="field"><label for="no-appt">For appointment on</label><input class="input" id="no-appt" type="date" value="${today}"></div></div>
<label class="toggle"><input type="checkbox" id="no-fasting" checked>Fasting sample required</label>
<div class="field"><label for="no-notes">Preparation notes for the patient</label><textarea class="input" id="no-notes" style="min-height:80px">Morning sample before 10:00. Take your usual hormones after the sample.</textarea></div>
<div class="prep" style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><span>Results due by <b id="no-due">4 Nov 2026</b> <span class="small">(appointment minus 14 days)</span></span><span>Price <b class="num" id="no-price">£${catalogue[0].price}.00</b></span></div>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" type="submit">Send to patient</button><button class="btn outline" type="button" data-act="close">Cancel</button></div></form>`,'dialog');}

function cSafeguarding(){return `<div class="page-head"><div><div class="eyebrow">Clinical</div><h1 class="title">Safeguarding <em>alerts</em></h1><p class="lede">Warnings shown on a patient's record. ${ic('lock',14)} Visible to clinicians only, never to patients or reception.</p></div><button class="btn outline" data-act="toast" data-msg="New alert form opened (demo)">${ic('plus',15)}Add alert</button></div>
<div class="stack" style="gap:12px">${safeguarding.map(a=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h3>${pById(a.pid).name}</h3>${pill('',a.type)}${pill(a.sev==='MODERATE'?'warn':'info',a.sev)}</div>${a.overdue?pill('crit','Review overdue','alert'):''}</div><p style="margin:0">${a.note}</p><div class="meta-row"><span>Added by ${a.by} · ${a.added}</span><span>Review due ${a.review}</span></div><div class="actions"><button class="btn outline sm" data-act="toast" data-msg="Alert marked as reviewed">Mark reviewed</button><button class="btn ghost" data-act="record" data-id="${a.pid}">Open record</button></div></div>`).join('')}</div>`;}

function cTeam(){const t=S.teamTab;let body='';
 if(t==='team')body=`<div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Locations</th><th>Last active</th></tr></thead><tbody>${team.map(m=>`<tr><td><span style="display:inline-flex;align-items:center;gap:10px"><span class="avatar" style="width:30px;height:30px;font-size:11px">${ini(m.n)}</span><b style="font-weight:500">${m.n}</b></span></td><td>${pill(m.role==='DOCTOR'?'dark':'',m.role)}</td><td class="small">${m.loc}</td><td class="small">${m.last}</td></tr>`).join('')}</tbody></table></div>`;
 else if(t==='audit')body=`<div class="tablewrap"><table><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Record</th></tr></thead><tbody>${audit.map(a=>`<tr><td class="small num">${a[0]}</td><td>${a[1]}</td><td>${a[2]}</td><td class="small">${a[3]}</td></tr>`).join('')}</tbody></table></div><p class="small">The audit log cannot be edited or deleted.</p>`;
 else if(t==='cat')body=`<div class="tablewrap"><table><thead><tr><th>Panel</th><th>Lab</th><th class="r">Tests</th><th class="r">Price</th></tr></thead><tbody>${catalogue.map(c=>`<tr><td>${c.n}</td><td class="small">${c.lab}</td><td class="r num">${c.tests}</td><td class="r num">£${c.price}.00</td></tr>`).join('')}</tbody></table></div>`;
 else body=`<div class="grid g3">${[['GoHighLevel','Messages, reminders, tasks and appointments','ok','Connected'],['Stripe','Lab and repeat prescription payments','ok','Connected'],['Resend','Sign-in links and system emails','ok','Connected'],['TDL Pathology','Automatic results feed','warn','Coming soon'],['Semble','Diary, notes and prescribing sync','warn','Coming soon'],['Fathom','Consultation transcripts and letters','warn','Coming soon']].map(x=>`<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><h3>${x[0]}</h3>${pill(x[2],x[3],x[2]==='ok'?'check':'clock')}</div><p class="small" style="margin:0">${x[1]}</p></div>`).join('')}</div>`;
 return `<div class="page-head"><div><div class="eyebrow">Clinic</div><h1 class="title">Team and <em>settings</em></h1></div></div><div class="stack"><div class="tabs" role="tablist">${[['team','Team'],['audit','Audit log'],['cat','Catalogue'],['int','Integrations']].map(([id,l])=>`<button role="tab" data-act="teamtab" data-v="${id}" aria-selected="${t===id}">${l}</button>`).join('')}</div>${body}</div>`;}

/* ---------- Render ---------- */
const VIEWS={'p-home':[pHome,'Home'],'p-orders':[pOrders,'My care / Lab orders'],'p-results':[pResults,'Health / My results'],'p-upload':[pUpload,'Health / Upload results'],'p-prescriptions':[pPrescriptions,'My care / Prescriptions'],'p-appointments':[pAppointments,'My care / Appointments'],'p-ask':[pAsk,'My care / Ask the clinic'],'p-letters':[pLetters,'My care / Letters and documents'],'p-privacy':[pPrivacy,'Account / Privacy and consent'],
 'c-dashboard':[cDashboard,'Today / Dashboard'],'c-patients':[cPatients,'Patients / Patient list'],'c-record':[cRecord,'Patients / Patient record'],'c-review':[cReview,'Patients / Results review'],'c-imports':[cImports,'Patients / Import queue'],'c-orders':[cOrders,'Patients / Lab orders'],'c-safeguarding':[cSafeguarding,'Clinical / Safeguarding alerts'],'c-team':[cTeam,'Clinic / Team and settings']};
function render(){let r=route();if(r!=='p-signin'&&!VIEWS[r])r='p-home';const root=document.getElementById('root');
 document.getElementById('view-patient').setAttribute('aria-pressed',r[0]==='p');document.getElementById('view-clinic').setAttribute('aria-pressed',r[0]==='c');
 root.innerHTML=r==='p-signin'?pSignin():shell(r,VIEWS[r][0](),VIEWS[r][1]);window.scrollTo(0,0);}

/* ---------- Events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
 if(el.tagName==='INPUT'||el.tagName==='SELECT')return;
 if(a!=='scroll'&&el.tagName==='A'&&!el.dataset.act)return;
 switch(a){
 case 'view':S.navOpen=false;go(v==='p'?'p-home':'c-dashboard');break;
 case 'menu':S.navOpen=!S.navOpen;document.getElementById('sidebar').classList.toggle('open',S.navOpen);break;
 case 'signout':go(route()[0]==='p'?'p-signin':'p-signin');break;
 case 'enter':go('p-home');break;
 case 'notify':toast(route()[0]==='p'?'No new notifications':'2 results arrived overnight');break;
 case 'close':closeOv();break;
 case 'toast':toast(el.dataset.msg);break;
 case 'marker':markerSheet(id);break;
 case 'letter':letterSheet(id);break;
 case 'repeat':repeatDialog(id);break;
 case 'checkout':checkoutSheet();break;
 case 'paynow':S.labPaid=true;closeOv();render();toast('Paid. Your barcode form is ready.');break;
 case 'resfilter':S.resFilter=v;render();break;
 case 'rxtab':S.rxTab=v;render();break;
 case 'appttab':S.apptTab=v;render();break;
 case 'reschedule':openOv(`<div class="dialog" role="dialog" aria-modal="true" aria-label="Reschedule">${ovHead('Reschedule','Choose a <em>new time</em>')}<p class="small" style="margin:0">Dr Gina Schoeman · Harley Street · 30 minutes</p>${['Thu 19 Nov 2026, 11:00','Fri 20 Nov 2026, 09:30','Tue 24 Nov 2026, 14:00'].map(s=>`<button class="qitem" data-act="pickslot" data-v="${s}">${ic('calendar',16)} ${s}</button>`).join('')}<p class="small" style="margin:0">Your bloods due date moves with your appointment.</p></div>`,'dialog');break;
 case 'pickslot':closeOv();toast('Request sent for '+v+'. The team will confirm.');break;
 case 'cancelappt':openOv(`<div class="dialog" role="dialog" aria-modal="true" aria-label="Cancel appointment">${ovHead('Cancel appointment','Cancel this <em>appointment</em>?')}<p style="margin:0">Follow-up consultation on Wed 18 Nov 2026 at 10:30.</p><div class="alert warn">${ic('alert')}<div class="t">Cancellations within 48 hours of the appointment may be charged in full.</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" data-act="cancelok">Cancel appointment</button><button class="btn outline" data-act="close">Keep appointment</button></div></div>`,'dialog');break;
 case 'cancelok':closeOv();toast('Cancellation request sent to the clinic.');break;
 case 'urg':document.querySelectorAll('[data-act="urg"]').forEach(b=>b.setAttribute('aria-pressed',b===el));break;
 case 'diaryloc':S.diaryLoc=v;render();setTimeout(()=>document.getElementById('diary')?.scrollIntoView(),0);break;
 case 'scroll':e.preventDefault();document.getElementById(v)?.scrollIntoView({behavior:'smooth'});break;
 case 'record':S.recordId=id;S.recTab='overview';go('c-record');break;
 case 'rectab':S.recTab=v;render();break;
 case 'cohort':S.cohort=!S.cohort;render();break;
 case 'export':openOv(`<div class="dialog" role="dialog" aria-modal="true" aria-label="Export">${ovHead('Export','Export <em>anonymised</em> data?')}<p style="margin:0">Names, dates of birth, contact details and IDs are removed. Ages are grouped into 5-year bands.</p><p class="small" style="margin:0">The export is recorded in the audit log.</p><div style="display:flex;gap:8px"><button class="btn" data-act="exportok">Export CSV</button><button class="btn outline" data-act="close">Cancel</button></div></div>`,'dialog');break;
 case 'exportok':closeOv();toast('Anonymised export prepared (demo)');break;
 case 'openrev':S.revSel=id;go('c-review');break;
 case 'revsel':S.revSel=id;render();break;
 case 'phrase':{const t=document.getElementById('rev-comment');t.value=(t.value?t.value.trim()+' ':'')+v;t.focus();break;}
 case 'release':{const r=S.review.find(x=>x.id===S.revSel);const n=pById(r.pid).name;S.review=S.review.filter(x=>x.id!==r.id);render();toast('Released to '+n+'. A notification will be sent.');break;}
 case 'reviewed':{const r=S.review.find(x=>x.id===S.revSel);S.review=S.review.filter(x=>x.id!==r.id);render();toast('Marked as reviewed. Not yet released to the patient.');break;}
 case 'impsel':S.impSel=id;render();break;
 case 'impitem':{const it=S.imports.find(x=>x.id===S.impSel);it.items[+el.dataset.i].st=v;if(it.items.every(x=>x.st))it.done=true;render();break;}
 case 'confirmhigh':{const it=S.imports.find(x=>x.id===S.impSel);it.items.forEach(x=>{if(!x.st&&x.c==='HIGH')x.st='ok'});if(it.items.every(x=>x.st))it.done=true;render();toast('High confidence values confirmed');break;}
 case 'gotoimp':go('c-imports');break;
 case 'neworder':newOrderDialog(id);break;
 case 'teamtab':S.teamTab=v;render();break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('ov').hidden)closeOv();
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr.row[data-act]')){e.preventDefault();e.target.click();}});
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv();});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='out-only'){S.outOnly=t.checked;render();}
 else if(t.dataset.act==='consent'){S.consents[t.dataset.v]=t.checked;render();toast(t.checked?'Consent given':'Consent withdrawn');}
 else if(t.id==='imp-patient'){const it=S.imports.find(x=>x.id===S.impSel);it.pid=t.value||null;render();}
 else if(t.id==='upload-file'&&t.files[0]){S.uploads.unshift({f:t.files[0].name,d:'29 Oct 2026',st:'team',note:null});render();toast('Uploaded. Our team will check it within 2 working days.');}
 else if(t.id==='no-appt'||t.id==='no-panel'){updOrder();}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='pt-search'||t.id==='global-search'){S.pq=t.value;if(route()!=='c-patients'){go('c-patients');}else{const pos=t.selectionStart;render();const n=document.getElementById('pt-search');n.focus();n.setSelectionRange(pos,pos);}}
 if(t.id==='ask-body'){document.getElementById('ask-count').textContent=t.value.length.toLocaleString('en-GB')+' / 1,000';}
});
function updOrder(){const a=document.getElementById('no-appt'),pn=document.getElementById('no-panel');if(!a)return;const d=new Date(a.value+'T12:00:00');if(!isNaN(d)){d.setDate(d.getDate()-14);document.getElementById('no-due').textContent=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}document.getElementById('no-price').textContent='£'+catalogue[+pn.value].price+'.00';}
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
 if(f.id==='signin-form'){document.getElementById('signin-sent').hidden=false;}
 else if(f.id==='checkout-form'){S.labPaid=true;closeOv();render();toast('Paid. Your barcode form is ready.');}
 else if(f.id==='repeat-form'){const m=meds.find(x=>x.id===f.dataset.id);S.repeats.unshift({med:m.name,d:'29 Oct 2026',st:'REQUESTED'});closeOv();S.rxTab='req';if(route()==='p-prescriptions')render();toast('Request sent. The team will confirm within 2 working days.');}
 else if(f.id==='ask-form'){S.questions.unshift({s:document.getElementById('ask-subject').value,d:'29 Oct 2026',st:'AWAITING',a:null});render();toast('Question sent. We reply within 2 working days.');}
 else if(f.id==='order-form'){const pid=document.getElementById('no-patient').value;const c=catalogue[+document.getElementById('no-panel').value];const due=document.getElementById('no-due').textContent.replace(/ \d{4}$/,'');const ad=new Date(document.getElementById('no-appt').value+'T12:00:00');
  S.orders.unshift({id:'LO-2026-0'+(17+S.orders.length-7),pid,panel:c.n,price:c.price,ordered:'29 Oct',due,appt:isNaN(ad)?'—':ad.toLocaleDateString('en-GB',{day:'numeric',month:'short'}),stage:0,risk:false});closeOv();if(route()==='c-orders')render();toast('Order sent to '+pById(pid).name+'. Payment reminders will run in GoHighLevel.');}
});
const dz=()=>document.getElementById('dropzone');
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#dropzone')){e.preventDefault();dz().classList.add('over');}});
document.addEventListener('dragleave',e=>{if(e.target.closest&&e.target.closest('#dropzone'))dz().classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropzone');if(!z)return;e.preventDefault();const f=e.dataTransfer.files[0];if(f){S.uploads.unshift({f:f.name,d:'29 Oct 2026',st:'team',note:null});render();toast('Uploaded. Our team will check it within 2 working days.');}});
window.addEventListener('hashchange',()=>{S.navOpen=false;closeOv();render();});
render();
})();
</script>
